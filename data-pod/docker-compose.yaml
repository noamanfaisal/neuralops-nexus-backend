# NeuralOps DATA POD — one box holding a team's big CSVs (an S3-compatible
# store) and answering SQL about them (DuckDB), attached to NeuralOps as an
# MCP server. Runs anywhere docker does: a RunPod, a VPS, the same host as
# NeuralOps.
#
#   python make_env.py       # creates .env with strong random secrets (never printed)
#   docker compose up -d     # on the NeuralOps box: add -f docker-compose.neuralops.yaml
#
# Then in NeuralOps: /add-mcp → Add server → transport HTTP,
# URL  http://<this box>:8900/mcp  (http://datapod:8900/mcp on the NeuralOps
# box), auth static secrets, secret = DATAPOD_TOKEN (grep DATAPOD_TOKEN .env).
#
# STORAGE (2026-11-01): MinIO retired its free edition — its images are gone
# from Docker Hub and quay.io — so the pod runs SeaweedFS (Apache-2.0), an
# S3-compatible store the pod's code talks to exactly as it talked to MinIO
# (path-style, s3v4). The env names (S3_KEY/S3_SECRET, MINIO_PORT) are kept
# so existing .env files keep working.
#
# PORTS: 8900 = the MCP server (NeuralOps dials this). MINIO_PORT → the S3
# API (8333 inside) — expose it only if people will use presigned upload/
# download links (S3_PUBLIC_ENDPOINT must then be this box's public address
# for that port).

services:
  s3:
    image: chrislusf/seaweedfs:4.06
    command: server -dir=/data -s3 -s3.port=8333 -ip.bind=0.0.0.0
    environment:
      # SeaweedFS's S3 gateway uses these when it has no config file.
      AWS_ACCESS_KEY_ID: ${S3_KEY:-datapod-admin}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET:?set S3_SECRET in .env}
    volumes:
      - s3-data:/data
    ports:
      - "${MINIO_PORT:-9000}:8333"
    restart: unless-stopped

  datapod:
    build: .
    environment:
      DATAPOD_TOKEN: ${DATAPOD_TOKEN:?set DATAPOD_TOKEN in .env}
      S3_ENDPOINT: http://s3:8333
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
      S3_KEY: ${S3_KEY:-datapod-admin}
      S3_SECRET: ${S3_SECRET:?set S3_SECRET in .env}
      S3_BUCKET: ${S3_BUCKET:-datapod}
    ports:
      - "${DATAPOD_PORT:-8900}:8900"
    depends_on: [s3]
    # The pod creates its bucket at start; while the store is still coming
    # up that can fail once — the restart policy simply tries again.
    restart: unless-stopped

volumes:
  s3-data:
