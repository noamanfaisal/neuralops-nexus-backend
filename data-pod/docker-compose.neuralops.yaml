# Run the data pod ON THE SAME BOX as NeuralOps, reachable only from inside.
#
#   docker compose -f docker-compose.yaml -f docker-compose.neuralops.yaml up -d --build
#
# The pod joins NeuralOps' own docker network, so the engine dials it by name:
#
#   MCP server URL in NeuralOps:   http://datapod:8900/mcp
#
# and NOTHING needs to be open to the internet. Keep the published ports on
# the loopback by setting, in .env:
#
#   DATAPOD_PORT=127.0.0.1:8900
#   MINIO_PORT=127.0.0.1:9000
#
# (make_env.py writes exactly that). On a RunPod or a separate VPS, use the
# plain docker-compose.yaml instead — see README.

services:
  datapod:
    networks: [default, neuralops]

networks:
  neuralops:
    external: true
    name: ${NEURALOPS_NETWORK:-neuralops-network}
