[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neuralops-console"
version = "0.1.0"
description = "The NeuralOps project console: call your project's MCP tools from a terminal and pipe results through the project folder."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "NeuralOps" }]
dependencies = ["httpx>=0.27"]
keywords = ["neuralops", "mcp", "console", "cli"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://neuralopsnexus.ai"

[project.scripts]
neuralops-console = "neuralops_console.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["neuralops_console"]
